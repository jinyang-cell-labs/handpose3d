mediapie_landmarks_node:
  ros__parameters:
    # ----------------------------- topics ------------------------------ #
    # Input image topics to run hand-landmark detection on.
    image_topics: ["camera0/image_raw", "camera1/image_raw"]
    # Explicit 1:1 output topics. Leave as [""] (empty) to auto-derive each
    # output as <input_topic> + annotated_suffix.
    annotated_topics: [""]
    annotated_suffix: "/landmarks/annotated"
    # Master switch: publish the annotated images (false = detect/log only).
    enable_annotation: true

    # --------------------------- landmark data ------------------------- #
    # Publish landmarks (2D image + 3D world), handedness and confidence as
    # handpose3d_msgs/HandLandmarks, one topic per input image topic
    # (<input_topic> + landmarks_suffix). The 3D landmarks_world field is only
    # populated when the model returns world landmarks.
    enable_landmark_msg: true
    landmarks_suffix: "/landmarks/hands"

    # --------------------------- 3D markers ---------------------------- #
    # Publish MediaPipe's hand_world_landmarks (metres, single-view estimate)
    # as a visualization_msgs/MarkerArray for RViz. NO camera_info needed:
    # these are model-estimated 3D points in a HAND-LOCAL frame (origin ~ the
    # hand's geometric center), so they show shape but not absolute placement.
    enable_3d_estimation: true
    markers_3d_topic: "landmarks/markers_3d"
    world_frame: "world"
    joint_size: 0.01        # m, sphere diameter
    line_width: 0.004       # m, bone thickness
    # Each (camera, hand) skeleton is offset so they don't overlap at origin.
    camera_spacing: 0.4     # m between cameras along x
    hand_spacing: 0.25      # m between Left/Right along y

    # --------------------------- MediaPipe ----------------------------- #
    model_path: "/workspace/ros2_ws/src/mediapie_landmarks_extraction/models/hand_landmarker.task"
    num_hands: 2
    min_hand_detection_confidence: 0.5
    min_hand_presence_confidence: 0.5
    min_tracking_confidence: 0.5
    # "video" -> detect_for_video (stateful, per-stream monotonic timestamps);
    # "image" -> detect (stateless per frame).
    running_mode: "video"

    # ----------------------------- overlay ----------------------------- #
    line_thickness: 2
    point_radius: 3
