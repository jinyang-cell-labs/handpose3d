stereo_depth_eval_node:
  ros__parameters:
    # The FISHEYE624 SLAM pair: left (1201-1) then right (1201-2). These are the
    # camera namespaces published by hot3_dataset_interface.
    camera_names: ["camera0", "camera1"]

    sync_slop: 0.05
    sync_queue_size: 10

    # Fisheye rectification. balance in [0,1] (0 = crop to the valid region,
    # densest overlap; 1 = keep all source FOV). fov_scale > 1 zooms out.
    balance: 0.0
    fov_scale: 1.0

    # StereoSGBM tuning. num_disparities multiple of 16; block_size odd.
    min_disparity: 0
    num_disparities: 128
    block_size: 5
    uniqueness_ratio: 10
    speckle_window_size: 100
    speckle_range: 2
    disp12_max_diff: 1

    # Depth validity clamps (metres) + color-mapping range for depth_color.
    min_depth: 0.1
    max_depth: 5.0

    publish_depth_color: true
    publish_rectified: true
