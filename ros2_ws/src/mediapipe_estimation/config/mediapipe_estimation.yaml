mediapipe_node:
  ros__parameters:
    # Recording to preview. Path is inside the container (repo is bind-mounted
    # at /workspace). recordings/ is gitignored.
    video_path: "/workspace/ros2_ws/recordings/capture_20260618_112004.avi"

    # MediaPipe HandLandmarker model (reused from handpose_estimation;
    # fetched by scripts/download_model.sh).
    model_path: "/workspace/ros2_ws/src/handpose_estimation/models/hand_landmarker.task"

    # Native resolution of this recording. Frames are only resized to this
    # when resize_to_config is true (useful to normalise across cameras).
    frame_width: 1920
    frame_height: 1080
    resize_to_config: false

    # Playback rate; 0.0 uses the video's own FPS (falls back to 30).
    fps: 0.0
    loop: true

    # Detector settings.
    num_hands: 1
    min_hand_detection_confidence: 0.5
    min_hand_presence_confidence: 0.5
    min_tracking_confidence: 0.5

    # Output.
    frame_id: "camera"
    annotated_topic: "mediapipe/annotated"
    draw_handedness: true
