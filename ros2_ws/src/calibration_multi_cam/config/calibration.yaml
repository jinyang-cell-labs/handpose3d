# =============================================================================
#  calibration_multi_cam - central configuration
#
#  Shared by all three nodes (intrinsic / extrinsic / publisher) via the ROS 2
#  wildcard node name "/**". Each node reads only the parameters it declares.
#
#  Workflow:
#    1. ros2 launch calibration_multi_cam intrinsic.launch.py
#       -> fill each camera's frame with the board, then
#          ros2 service call /calibration_intrinsic/calibrate std_srvs/srv/Trigger {}
#       -> writes intrinsics_file
#    2. ros2 launch calibration_multi_cam extrinsic.launch.py
#       -> move the board across overlapping views, then
#          ros2 service call /calibration_extrinsic/calibrate std_srvs/srv/Trigger {}
#       -> loads intrinsics_file, writes extrinsics_file
#    3. ros2 launch calibration_multi_cam publish.launch.py
#       -> loads both files, publishes CameraInfo + TF/Pose
#
#  The FIRST camera in camera_names is the world frame (world == camera0).
# =============================================================================
/**:
  ros__parameters:

    # ---- cameras (camera_names[0] is the world/origin camera) -------------
    camera_names: ["camera0", "camera1"]
    camera0.topic: "/camera0/image_raw"
    camera1.topic: "/camera1/image_raw"
    #camera2.topic: "/camera2/image_raw"

    # ---- calibration target (ethz-asl/kalibr AprilGrid convention) --------
    target.type: "aprilgrid"
    target.family: "36h11"
    target.tag_cols: 6
    target.tag_rows: 6
    target.tag_size: 0.03                 # tag edge length [m] (measure it!)
    target.tag_spacing: 0.333             # inter-tag gap / tag_size
    target.border_bits: 2                 # black-border width; kalibr_create_target_pdf uses 2

    # ---- collection (both stages) -----------------------------------------
    min_corners_per_camera: 8             # a camera "sees" the target with >= this many corners
    novelty_min_pixel_motion: 12.0        # only keep a view if corners moved >= this [px]
    status_period_sec: 3.0

    # intrinsic stage
    min_views_per_camera: 20              # per-camera views before intrinsics are solvable
    max_views_per_camera: 80              # keep-most-informative cap per camera (0 = unlimited)

    # extrinsic stage
    sync_slop: 0.02                       # ApproximateTimeSynchronizer tolerance [s]
    sync_queue_size: 20
    min_cameras_per_view: 2               # keep a view only if >= this many cameras see the board
    min_views: 30                         # status readiness threshold
    # Hard cap on retained synchronized views (0 = unlimited). When full, a new
    # view evicts the most redundant one (maximin diversity), so the kept set
    # stays varied instead of growing. Solve cost ~ scales with this value.
    max_views: 150
    robust_loss: "huber"                  # huber | cauchy | soft_l1 | linear
    robust_loss_scale: 1.0                # [px]

    # ---- output ------------------------------------------------------------
    world_frame: "camera0"                # world coordinate == first camera
    intrinsics_file: "/workspace/ros2_ws/src/calibration_multi_cam/config/intrinsics.yaml"
    extrinsics_file: "/workspace/ros2_ws/src/calibration_multi_cam/config/extrinsics.yaml"
    publish_camera_info: true             # intrinsics-only CameraInfo (no R, no P)
    publish_tf: true                      # static TF world -> cam_i
    publish_pose: true                    # also publish extrinsics as geometry_msgs/PoseArray
    camera_info_topic_template: "{camera}/camera_info"

    # ---- board pose tracker (single camera; board_pose.launch.py) ----------
    # Detects the board in ONE camera, derives its pose from that camera's
    # intrinsics (intrinsics_file), broadcasts <camera> -> board over TF, and
    # republishes the image with the board axes drawn for eye-alignment.
    board_pose.camera: ""                 # "" = camera_names[0]; or "camera1", ...
    board_pose.board_frame: "calib_board" # child TF frame for the board
    board_pose.axis_length: 0.1           # drawn/RViz axis length [m]
    board_pose.image_topic: ""            # "" = /<camera>/board_pose/image_axes
    # The /calibration_board_pose/save_board_pose Trigger service latches the
    # current T_cam_board here; the publisher reads it back into static TF.
    board_pose_file: "/workspace/ros2_ws/src/calibration_multi_cam/config/board_pose.yaml"

    # ---- operator_body (rigid offset on the calibration board) -------------
    # The board is mounted at a known, measured pose relative to the operator's
    # body, so this defines the TF  <board_frame> -> operator_body. Combined
    # with the saved board pose it completes the chain
    #   world (camera0) -> <camera> -> board_frame -> operator_body
    # letting hand poses be expressed in the operator_body frame.
    operator_body.frame: "operator_body"  # child TF frame name
    operator_body.position: [0.5, -0.5, 0.0]   # [x, y, z] in board_frame [m]
    operator_body.rotation: [0.0, 90.0, 0.0]   # intrinsic XYZ euler [deg] (Rx,Ry,Rz)
    publish_operator_body: true           # publisher emits board_frame -> operator_body
