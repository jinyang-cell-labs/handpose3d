# Multi-camera recorder configuration.
#
# cameras: initial device for each preview window — one entry per window
#          (the list length sets how many windows the GUI shows). Each entry
#          is an integer index (4 -> /dev/video4), a device path, or a stable
#          /dev/v4l/by-id/ symlink (survives replug/renumbering). Use null
#          for a window that starts empty. Every window also has a dropdown
#          in the GUI to switch between detected capture devices at any time.
# NOTE: with UVC webcams only the even-numbered node of each camera captures
#       video; the odd sibling (video1, video3, ...) is a metadata node.
cameras:
  - 0    # Azurewave USB Camera
  - 2    # icSpring IW 1000 webcam
  - /dev/v4l/by-id/usb-Arducam_Technology_Co.__Ltd._Arducam_OV9782_USB_Camera_UC852-video-index0
  - null # empty window — pick a device in the GUI
# Generic default per spec (4 cameras): [0, 2, 4, 6]

# Capture settings applied to every camera.
width: 1280
height: 720
fps: 30
# FOURCC requested from the camera (MJPG lets USB webcams reach 30 fps at 720p).
capture_fourcc: MJPG

# Recording settings.
# Codec + container for the files written to disk.
record_fourcc: MJPG
record_extension: avi
# Where recording sessions are stored. Each session becomes a subfolder
# session_YYYYmmdd_HHMMSS/ containing one video per camera, meta.yaml and
# timestamps.csv (per-frame capture times for sync verification).
output_dir: ~/recordings/multi_cam

# Preview settings.
# Preview refresh rate in the GUI (recording always runs at `fps`).
preview_fps: 20
# Grid columns for the preview layout (4 cameras -> 2x2).
grid_columns: 2

# ---- calibration (Calibrate tab) -------------------------------------------
# Reuses the solver of ros2_ws/src/calibration_multi_cam on recorded sessions.
# Everything here is a GUI *default* — rig assignment, reference camera and
# camera model are editable per session in the Calibrate tab.
calibration:
  # Rig groups: cameras rigidly mounted together. Extrinsics are solved per
  # rig (the pose BETWEEN rigs is dynamic and never solved). `reference` is
  # the camera whose frame is the rig's origin (0,0,0).
  rigs:
    fixed:
      cameras: [video0, video2]
      reference: video0
    head:
      cameras: []          # head-mounted cameras (fill in when both exist)
      reference: null      # null = first camera of the rig
  default_rig: head        # cameras not listed above default to this rig
  # Projection model per camera: pinhole-radtan (normal lens) or pinhole-equi
  # (wide-FOV fisheye, e.g. the Arducam OV9782).
  models:
    video0: pinhole-radtan
    video2: pinhole-radtan
  default_model: pinhole-equi
  # AprilGrid target (kalibr convention) — must match the printed board!
  target:
    type: aprilgrid
    family: 36h11
    tag_rows: 6
    tag_cols: 6
    tag_size: 0.03         # tag edge length [m] (measure it!)
    tag_spacing: 0.333     # inter-tag gap / tag_size
    border_bits: 2
  # Collection: process every Nth recorded frame; keep views with >= min_corners
  # detected that moved >= novelty px since the last kept view.
  frame_step: 1
  min_corners: 8
  novelty_min_pixel_motion: 12.0
  min_views_per_camera: 20   # required per camera for intrinsics
  max_views_per_camera: 80   # keep-most-informative cap (0 = unlimited)
  min_views_extrinsic: 30    # required synchronized views per rig
  max_views_extrinsic: 150
  # A rig view is used only if every rig camera has a FRESH frame (not a
  # duplicate from a slow camera) captured within this window [s].
  sync_max_skew: 0.015
  robust_loss: huber         # bundle adjustment loss: huber|cauchy|soft_l1|linear
  robust_loss_scale: 1.0     # [px]
  # Path to the calibration_multi_cam package (solver library).
  # null = ../ros2_ws/src/calibration_multi_cam relative to this tool.
  solver_path: null
